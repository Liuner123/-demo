<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=2560,height=1440,initial-scale=1.0"><title>玩法选择</title><style>html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:#000}body{position:relative}#play-select-canvas{position:absolute;left:0;top:0;width:2560px;height:1440px;transform-origin:left top}#play-select-canvas img{display:block;user-select:none;-webkit-user-drag:none}.play-select-entry{cursor:pointer;outline:none}.play-select-entry:focus-visible{filter:brightness(1.12) drop-shadow(0 0 12px rgba(217,243,255,.7))}</style></head><body><main id="play-select-canvas"><img style="width:2560px;height:1440px;position:absolute;left:0;top:0" src="assets/CodeBuddyAssets/8740_176458/1.png" alt="玩法选择页面背景"><img id="play-select-entry" class="play-select-entry" style="width:466px;height:945px;position:absolute;left:2063px;top:281px" src="assets/CodeBuddyAssets/8740_176458/2.png" alt="进入相位秘境" role="button" tabindex="0"></main><script>(function(){var canvas=document.getElementById('play-select-canvas'),entry=document.getElementById('play-select-entry');function fit(){canvas.style.transform='scale('+Math.min(window.innerWidth/2560,window.innerHeight/1440)+')'}function openMode(){window.location.href='mode-select.html'}entry.addEventListener('click',openMode);entry.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openMode()}});window.addEventListener('resize',fit);fit()})()</script></body></html>
