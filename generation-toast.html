<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}#war-generation-toast-canvas{position:relative;width:1680px;height:84px;transform-origin:left top}#war-generation-toast-image,#war-generation-toast-incomplete-image{display:none;position:absolute;inset:0;width:1680px;height:84px}#war-generation-toast-image.is-visible,#war-generation-toast-incomplete-image.is-visible{display:block}#war-generation-toast-label{position:absolute;left:640px;top:2px;width:400px;height:80px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:0 8px;background:rgba(24,34,48,.95);border-top:2px solid rgba(217,243,255,.15);border-bottom:2px solid rgba(217,243,255,.15);color:rgba(217,243,255,.7);font:650 40px/1 NZFuture-Body-SB,NZFuture-Hei,Microsoft YaHei,Arial,sans-serif;text-shadow:1px 2px 0 rgba(0,0,0,.75);white-space:nowrap}#war-generation-toast-label.is-hidden{display:none}#war-generation-toast-label.is-selection-warning{left:340px;width:1000px}</style></head><body><div id="war-generation-toast-canvas"><img id="war-generation-toast-image" src="assets/CodeBuddyAssets/8802_264404/1.png" alt=""><img id="war-generation-toast-incomplete-image" src="assets/CodeBuddyAssets/8828_493169/1.png" alt=""><div id="war-generation-toast-label">作战计划已生成</div></div><script>(function(){var canvas=document.getElementById("war-generation-toast-canvas"),successImage=document.getElementById("war-generation-toast-image"),incompleteImage=document.getElementById("war-generation-toast-incomplete-image"),label=document.getElementById("war-generation-toast-label");function fit(){if(canvas)canvas.style.transform="scale("+Math.min(1,window.innerWidth/1680)+")"}function setMessage(message){var incomplete=message==="没有形成完整作战路线";if(successImage)successImage.classList.toggle("is-visible",!incomplete);if(incompleteImage)incompleteImage.classList.toggle("is-visible",incomplete);if(label){label.textContent=message||"作战计划已生成";label.classList.toggle("is-hidden",incomplete);label.classList.toggle("is-selection-warning",message==="需激活前一列有路线相连的节点")}}var query=new URLSearchParams(window.location.search);setMessage(query.get("message"));window.addEventListener("message",function(e){if(e.data&&e.data.type==="war-generation-toast")setMessage(e.data.message)});fit();window.addEventListener("resize",fit)})()</script></body></html>
